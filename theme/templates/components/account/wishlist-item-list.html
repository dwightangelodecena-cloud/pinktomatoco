<div class="product-grid wishlist-grid">
    {{#each wishlist.items}}
        <div class="wishlist-grid-item">
            {{> components/pinktomato/product-card product=this index=@index}}
            {{#if ../show_remove}}
                <form action="{{remove_url}}" method="post">
                    <button type="submit" class="link-button">Remove from wishlist</button>
                </form>
            {{/if}}
        </div>
    {{/each}}
</div>
{{> components/pinktomato/pagination wishlist.pagination}}
